 as Hóa Khoa and Thiên Đồng as Hóa Kỵ; others give Thiên Phủ as Hóa Khoa and Thiên Đồng as Hóa Kỵ. `,zh:`庚干本命盘取天同化科、太阴化忌，依三位越南作者的紫微书；《紫微斗数新编》与《紫微斗数全书》作太阴化科、天同化忌；也有的书作天府化科、天同化忌。`},quanshu:{vi:`Riêng can Canh, lá số này dùng Thái Âm hóa Khoa, Thiên Đồng hóa Kỵ theo Tân Biên và Tử Vi Đẩu Số toàn thư; Huyền Vi, Thiên Lương và Việt Viêm Tử ghi Thiên Đồng hóa Khoa, Thái Âm hóa Kỵ; Vương Đình Chi ghi Thiên Phủ hóa Khoa, Thiên Đồng hóa Kỵ. `,en:`For Canh, this chart uses Thái Âm as Hóa Khoa and Thiên Đồng as Hóa Kỵ, after Tân Biên and the Tử Vi Đẩu Số Toàn Thư; Huyền Vi, Thiên Lương and Việt Viêm Tử give Thiên Đồng as Hóa Khoa and Thái Âm as Hóa Kỵ; Wang Tingzhi gives Thiên Phủ as Hóa Khoa and Thiên Đồng as Hóa Kỵ. `,zh:`庚干本命盘取太阴化科、天同化忌，依《紫微斗数新编》与《紫微斗数全书》；三位越南作者的紫微书作天同化科、太阴化忌；王亭之作天府化科、天同化忌。`},zhongzhou:{vi:`Riêng can Canh, lá số này dùng Thiên Phủ hóa Khoa, Thiên Đồng hóa Kỵ theo Vương Đình Chi (phái Trung Châu); Tân Biên và Tử Vi Đẩu Số toàn thư ghi Thái Âm hóa Khoa, Thiên Đồng hóa Kỵ; Huyền Vi, Thiên Lương và Việt Viêm Tử ghi Thiên Đồng hóa Khoa, Thái Âm hóa Kỵ. `,en:`For Canh, this chart uses Thiên Phủ as Hóa Khoa and Thiên Đồng as Hóa Kỵ, after Wang Tingzhi (Zhongzhou school); Tân Biên and the Tử Vi Đẩu Số Toàn Thư give Thái Âm as Hóa Khoa and Thiên Đồng as Hóa Kỵ; Huyền Vi, Thiên Lương and Việt Viêm Tử give Thiên Đồng as Hóa Khoa and Thái Âm as Hóa Kỵ. `,zh:`庚干本命盘取天府化科、天同化忌，依王亭之（中州派）；《紫微斗数新编》与《紫微斗数全书》作太阴化科、天同化忌；三位越南作者的紫微书作天同化科、太阴化忌。`}},gi={"":{vi:`Hỏa Tinh, Linh Tinh an theo Tân Biên: Dương Nam, Âm Nữ đếm Hỏa thuận, Linh nghịch; Âm Nam, Dương Nữ ngược lại. Tử Vi Đẩu Số toàn thư đếm cả hai sao thuận.`,en:`Hỏa Tinh and Linh Tinh follow Tân Biên: for a yang-year man or yin-year woman Hỏa Tinh counts forward and Linh Tinh backward, the other way round for a yin-year man or yang-year woman. The Tử Vi Đẩu Số Toàn Thư counts both forward.`,zh:`火星、铃星依《紫微斗数新编》安：阳男阴女火星顺数、铃星逆数，阴男阳女相反。《紫微斗数全书》二星皆顺数。`},quanshu:{vi:`Hỏa Tinh, Linh Tinh an theo Tử Vi Đẩu Số toàn thư: cả hai sao đếm t chừ lúc cần quyết đoán.`,advice:`Đặt hạn chót cho việc phân tích, ưu tiên hành động thử nghiệm nhỏ (prototype) thay vì chờ kế hoạch hoàn hảo 100%.`,citations:[{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,quote:`Cơ Lương gia hội, thiện đàm binh.`,note:`Thiên Cơ hội Thiên Lương chủ về mưu lược, khả năng phân tích và hoạch định xuất sắc.`},{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,note:`Xếp Thiên Cơ là "Huynh Đệ chủ", biểu trưng cho sự linh hoạt và năng lực kết nối ngang hàng.`}]},"Thái Dương":{name:`Thái Dương`,han:`太陽`,element:`Hỏa`,huaQi:`Quý tinh, Quang minh, Bác ái`,archetype:`Người lan tỏa, thẳng thắn, trách nhiệm cộng đồng`,traditional:`Chủ về công danh, uy tín, cha/nam giới và tinh thần cống hiến. Miếu/Vượng (từ cung Dần đến Ngọ) như mặt trời ban trưa, rực rỡ và hanh thông; Hãm địa (từ Thân đến Tý) thì vất vả hơn, cần lấy sự kiên trì và chuyên môn bù đắp.`,modern:`Tính cách minh bạch, thích giúp đỡ và dễ tạo niềm tin nơi công chúng. Tuy nhiên vì hay ôm trách nhiệm cho người khác, bạn dễ kiệt sức nếu không biết đặt ranh giới năng lượng.`,advice:`Tập trung tỏa sáng ở lĩnh vực đúng sở trường, tránh dàn trải sức lực để chiều lòng tất cả mọi người.`,citations:[{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,quote:`Nhật lệ trung thiên, hữu chuyên quyền chi quý, địch quốc chi phú.`,note:`Thái Dương cư Ngọ (Nhật Lệ Trung Thiên) là cách cục sáng sủa bậc nhất về danh vọng.`},{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,note:`Lưu ý sự khác biệt rất lớn giữa Thái Dương đắc/miếu (ban ngày) và hãm địa (ban đêm).`}]},"Vũ Khúc":{name:`Vũ Khúc`,han:`武曲`,element:`Kim`,huaQi:`Tài tinh, Quả quyết, Thực tế`,archetype:`Người thực thi mạnh mẽ, sắc sảo về tài chính`,traditional:`Bắc Đẩu Tài Tinh, chủ về tiền bạc, kỷ luật, tính cương nghị và sự thực tế. Rất hợp kinh doanh, tài chính, kỹ thuật, quản trị vận hành. Vì tính Kim cứng rắn nên sách cổ gọi là "Quả Tú chi tinh", dễ khô khan trong tình cảm.`,modern:`Năng lực thực thi cao, nói được làm được, đo lường hiệu quả bằng kết quả cụ thể. Cần cân bằng giữa hiệu suất công việc và sự mềm mỏng trong giao tiếp gia đình/đối tác.`,advice:`Tận dụng kỷ luật tài chính bẩm sinh, đồng thời dành thời gian lắng nghe cảm xúc của người thân thay vì chỉ giải quyết vấn đề bằng lý trí.`,citations:[{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,quote:`Vũ Khúc vi Tài Bạch chi chủ, cương nghị quả đoán.`,note:`Xác định Vũ Khúc là Chính Tài Tinh chủ quản năng lực tạo lập và tích lũy tài sản.`},{source:`Tử Vi Hàm Số`,authorOrSchool:`Nguyễn Phát Lộc`,note:`Nhấn mạnh Vũ Khúc tối kỵ Hóa Kỵ và Cô Thần/Quả Tú khi luận về khía cạnh tình cảm.`}]},"Thiên Đồng":{name:`Thiên Đồng`,han:`天同`,element:`Thủy`,huaQi:`Phúc tinh, Hòa hợp, Hưởng thụ`,archetype:`Người ôn hòa, giàu cảm xúc, trân trọng sự bình an`,traditional:`Nam Đẩu Phúc Tinh, chủ về phúc đức, sự nhân hậu, yêu thích nghệ thuật và đời sống tinh thần. Sách cổ thường nói Thiên Đồng "không sợ sát tinh kích phát" ở mức độ vừa phải, vì quá yên ổn dễ sinh tâm lý ngại bứt phá.`,modern:`Chỉ số cảm xúc (EQ) tốt, dễ tạo thiện cảm, thích môi trường làm việc hài hòa. Khi đối mặt áp lực, bạn thường tìm cách xoa dịu xung đột nhưng đôi lúc dễ trì hoãn việc khó.`,advice:`Đặt ra các mục tiêu có cấu trúc và người đồng hành nghiêm khắc để biến sự sáng tạo, thiện cảm thành thành tựu dài hạn.`,citations:[{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,quote:`Thiên Đồng ích thọ bảo sinh, phùng hung hóa cát.`,note:`Khẳng định bản chất phúc tinh có khả năng xoa dịu nghịch cảnh của Thiên Đồng.`},{source:`Trung Châu Phái (Vương Đình Chi)`,authorOrSchool:`Bắc Phái / Trung Châu`,note:`Luận rằng Thiên Đồng cần chút áp lực (như Hóa Quyền hoặc sát tinh vừa phải) để kích hoạt ý chí phấn đấu.`}]},"Liêm Trinh":{name:`Liêm Trinh`,han:`廉貞`,element:`Hỏa`,huaQi:`Tù tinh, Thứ Đào Hoa, Kỷ luật`,archetype:`Người sắc sảo, nguyên tắc, giàu đam mê và sức hút`,traditional:`Bắc Đẩu Quan Lộc chủ, mang hai mặt rõ rệt: khi thanh sạch (gặp Lộc, Quyền, Khoa, Thiên Phủ, Thiên Tướng) thì cực kỳ liêm chính, có tài quản trị và thẩm mỹ; khi vướng Hóa Kỵ, Kình Đà thì dễ vướng rắc rối thị phi hoặc pháp lý.`,modern:`Cá tính mạnh, có gu thẩm mỹ tinh tế, tiêu chuẩn đạo đức và ranh giới rõ ràng. Bạn làm việc rất bùng nổ khi đúng đam mê, nhưng dễ nóng nảy hoặc khắt khe quá mức khi chịu áp lực.`,advice:`Giữ minh bạch tuyệt đối trong giấy tờ, hợp đồng và tài chính; rèn thói quen hạ nhiệt cảm xúc trước khi phản hồi các tình huống căng thẳng.`,citations:[{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,quote:`Liêm Trinh thanh bạch năng tương thủ.`,note:`Nhấn mạnh chữ "Thanh bạch" là chìa khóa giúp Liêm Trinh phát huy công danh bền vững.`},{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,note:`Ghi nhận Liêm Trinh là "Thứ Đào Hoa", vừa có duyên giao tế vừa đòi hỏi tự chủ cao.`}]},"Thiên Phủ":{name:`Thiên Phủ`,han:`天府`,element:`Thổ`,huaQi:`Lệnh tinh, Tài khố, Bảo tồn`,archetype:`Người vững chãi, bao dung, giỏi quản lý nguồn lực`,traditional:`Nam Đẩu chủ tinh, ví như kho tàng của triều đình. Chủ về điền sản, tích lũy, sự cẩn trọng và bền vững. Rất ưa gặp Lộc Tồn, Hóa Lộc (Phủ Phùng Lộc) để "kho đầy ắp"; kỵ Tuần, Triệt hoặc Không Kiếp làm "lộ khố" (hao hụt).`,modern:`Thiên về tư duy an toàn, quản trị rủi ro và xây dựng nền tảng lâu dài. Bạn đáng tin cậy, giỏi giữ nhịp ổn định nhưng đôi khi hơi thận trọng quá mức trước những cơ hội đổi mới nhanh.`,advice:`Xây dựng quỹ dự phòng vững chắc, sau đó trích một phần nhỏ ngân sách cố định để thử nghiệm cơ hội mới mà vẫn giữ trọn cảm giác an tâm.`,citations:[{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,quote:`Thiên Phủ vi tài bạch chi khố, năng giải ách chế sát.`,note:`Thiên Phủ là kho tài lộc và có khả năng bảo vệ, ổn định cục diện.`},{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,note:`Luận kỹ thế "Phủ Tướng Triều Viên" — khi Thiên Phủ gặp Thiên Tướng sẽ rất vững vàng về tài lộc và hậu thuẫn.`}]},"Thái Âm":{name:`Thái Âm`,han:`太陰`,element:`Thủy`,huaQi:`Phú tinh, Điền Trạch chủ, Tinh tế`,archetype:`Người sâu sắc, giàu trực giác, tích lũy thầm lặng`,traditional:`Chủ về tài sản tích lũy (đặc biệt là bất động sản), mẹ/nữ giới và đời sống nội tâm. Đẹp nhất khi ở các cung ban đêm (Dậu, Tuất, Hợi, Tý — như cách "Nguyệt Lãng Thiên Môn" tại Hợi). Hãm địa ban ngày dễ vất vả, đa sầu đa cảm.`,modern:`Trực giác tinh nhạy, quan sát chi tiết xuất sắc và có năng lực quản trị tài sản dài hạn rất tốt. Tuy nhiên bạn dễ bị ảnh hưởng bởi bầu không khí xung quanh và hay giữ nỗi lo trong lòng.`,advice:`Phát huy thế mạnh đầu tư/tích lũy đều đặn, chọn không gian sống yên tĩnh và chia sẻ suy nghĩ với người tin cậy thay vì tự suy diễn.`,citations:[{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,quote:`Thái Âm cư Hợi, danh viết Nguyệt Lãng Thiên Môn.`,note:`Cách cục kinh điển chủ về tài sản, học vấn và sự thanh cao.`},{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,note:`Thái Âm là Điền Trạch chủ, tài lộc mang tính tích tụ bền bỉ chứ không bộc phát.`}]},"Tham Lang":{name:`Tham Lang`,han:`貪狼`,element:`Thủy`,huaQi:`Chính Đào Hoa, Dục vọng, Đa tài`,archetype:`Người cuốn hút, tham vọng, giao tiếp và trải nghiệm rộng`,traditional:`Bắc Đẩu đệ nhất tinh về giao tế, tài nghệ và khát vọng chinh phục. Gặp Hỏa Tinh hoặc Linh Tinh (Hỏa Tham / Linh Tham) ở vị trí đẹp thì dễ bộc phát cơ hội lớn. Gặp Tuần, Triệt hoặc Thiên Không lại dễ chuyển hướng sang chiều sâu triết lý, tu dưỡng.`,modern:`Năng lượng sống dồi dào, giỏi kết nối mạng lưới quan hệ, nhanh nhạy nắm bắt xu hướng thị trường. Thách thức lớn nhất là dễ phân tán vào quá nhiều sở thích hoặc cám dỗ ngắn hạn.`,advice:`Chọn 1–2 mục tiêu lớn để dồn toàn lực thay vì ôm đồm nhiều hướng cùng lúc; biến sức hút giao tiếp thành giá trị chuyên môn thật.`,citations:[{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,quote:`Tham Lang Hỏa Linh tương phùng, danh chấn chư bang.`,note:`Cách cục Hỏa Tham / Linh Tham nổi tiếng về sự bứt phá khi gặp thời cơ.`},{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,note:`Nhấn mạnh Tham Lang vừa là sao Đào Hoa vừa là sao học thuật, nghệ thuật và ngoại giao.`}]},"Cự Môn":{name:`Cự Môn`,han:`巨門`,element:`Thủy`,huaQi:`Ám tinh, Ngôn ngữ, Phân tích sâu`,archetype:`Nhà phản biện, nghiên cứu, sắc sảo ngôn từ`,traditional:`Bắc Đẩu Ám Tinh, chủ về khẩu thiệt, nghiên cứu, luật pháp, giảng dạy và truy tìm sự thật. Rất ưa Hóa Lộc, Hóa Quyền, Hóa Khoa hoặc Thái Dương sáng chiếu để "khai ám" (xua tan mờ ám), biến lời nói thành uy tín lớn.`,modern:`Tư duy phản biện xuất sắc, nhìn ra lỗ hổng mà người khác bỏ qua. Rất hợp nghề tư vấn, luật, phân tích dữ liệu, truyền thông. Cần chú ý cách diễn đạt để sự thẳng thắn không vô tình làm tổn thương người nghe.`,advice:`Dùng lời nói để xây dựng giải pháp thay vì chỉ chỉ ra lỗi sai; luôn kiểm chứng thông tin kỹ trước khi tranh luận.`,citations:[{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,quote:`Thạch Trung Ẩn Ngọc — Cự Môn tại Tý Ngọ gặp Khoa Lộc Quyền.`,note:`Ví như ngọc ẩn trong đá, cần mài giũa và thời gian mới tỏa sáng rực rỡ.`},{source:`Trung Châu Phái`,authorOrSchool:`Vương Đình Chi`,note:`Nhấn mạnh Cự Môn cần Thái Dương chiếu sáng hoặc Hóa Lộc/Khoa để hóa giải tính nghi kỵ.`}]},"Thiên Tướng":{name:`Thiên Tướng`,han:`天相`,element:`Thủy`,huaQi:`Ấn tinh, Phò tá, Công bằng`,archetype:`Người chuẩn mực, đáng tin cậy, giỏi điều hòa quan hệ`,traditional:`Nam Đẩu Ấn Tinh, ví như chiếc ấn tín của triều đình — chủ về uy tín, chữ tín, sự hào hiệp và năng lực quản trị trung gian. Rất chịu ảnh hưởng bởi hai cung giáp kề (Hình Kỵ Giáp Ấn vs Tài Ấm Giáp Ấn).`,modern:`Sống có nguyên tắc, trọng lời hứa, có thẩm mỹ chỉn chu và giỏi làm cầu nối giữa các bên. Tuy nhiên bạn đôi khi quá để tâm đến kỳ vọng của người khác mà quên ưu tiên nhu cầu bản thân.`,advice:`Giữ vững chữ tín như tài sản lớn nhất, đồng thời cẩn trọng kiểm tra điều khoản khi đứng ra bảo lãnh hoặc ký kết thay người khác.`,citations:[{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,quote:`Thiên Tướng vi Ấn tinh, năng chế Liêm Trinh chi ác.`,note:`Thiên Tướng đại diện cho sự công minh và khả năng cân bằng xung đột.`},{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,note:`Lưu ý tầm quan trọng của hai cung giáp Thiên Tướng khi luận độ vững chắc của ấn tín.`}]},"Thiên Lương":{name:`Thiên Lương`,han:`天梁`,element:`Mộc`,huaQi:`Ấm tinh, Thọ tinh, Nguyên tắc`,archetype:`Người che chở, đạo đức, cố vấn đáng tin cậy`,traditional:`Nam Đẩu Ấm Tinh, chủ về che chở, giải ách, y học, giáo dục và sự trường thọ. Thiên Lương thường mang lại cảm giác gặp khó rồi lại có quý nhân hoặc lối thoát bất ngờ ("ngộ nan trình tường").`,modern:`Chín chắn, giàu tinh thần trách nhiệm, thích làm những việc có ý nghĩa xã hội và truyền đạt kinh nghiệm. Đôi khi dễ trở nên hơi bảo thủ hoặc mang tâm thế "dạy bảo" khi góp ý.`,advice:`Phát huy năng lực cố vấn, chuyên môn sâu và y tế/giáo dục/quản trị chuẩn mực; giữ tâm thế cởi mở với góc nhìn của thế hệ trẻ.`,citations:[{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,quote:`Thiên Lương vi Ấm tinh, chủ thọ, năng hóa giải hung nguy.`,note:`Sao giải ách hàng đầu trong hệ thống 14 chính tinh.`},{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,note:`Nhấn mạnh Thiên Lương không hợp quá nặng tính đầu cơ mạo hiểm, hợp tích lũy uy tín bền vững.`}]},"Thất Sát":{name:`Thất Sát`,han:`七殺`,element:`Kim`,huaQi:`Tướng tinh, Quyết liệt, Tiên phong`,archetype:`Người tiên phong, bản lĩnh, dứt khoát trước thử thách`,traditional:`Nam Đẩu Tướng Tinh, chủ về quyền uy, hành động mạnh mẽ và khả năng xoay chuyển nghịch cảnh. Đẹp nhất là cách "Thất Sát Triều Đẩu" (cư Dần, Thân, Tý, Ngọ). Cuộc đời thường có những bước ngoặt lớn nhưng càng qua thử thách càng vững.`,modern:`Tinh thần độc lập cao, dám làm những việc khó mà người khác e ngại, tốc độ ra quyết định nhanh. Điểm cần tiết chế là sự nóng vội và xu hướng hành động đơn độc.`,advice:`Kênh hóa sự quyết liệt vào các dự án đột phá hoặc khởi nghiệp có kỷ luật; luôn dành 10 giây kiểm tra rủi ro trước khi chốt quyết định lớn.`,citations:[{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,quote:`Thất Sát Triều Đẩu, tước lộc vinh xương.`,note:`Một trong những cách cục mạnh mẽ nhất về ý chí và sự nghiệp tự lập.`},{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,note:`Xếp Thất Sát vào trục Sát Phá Tham — bộ sao của sự biến đổi và tiên phong.`}]},"Phá Quân":{name:`Phá Quân`,han:`破軍`,element:`Thủy`,huaQi:`Hao tinh, Khai phá, Đổi mới`,archetype:`Người cải cách, phá cũ lập mới, sáng tạo táo bạo`,traditional:`Bắc Đẩu Hao Tinh, ví như vị tiên phong đi mở đường — chủ về sự phá bỏ lối mòn để kiến tạo cái mới. Thường phải trải qua quá trình thay đổi, thử sai trước khi đạt thành tựu lớn ("tiên phá hậu thành").`,modern:`Không chịu nổi sự nhàm chán hay quy trình cũ kỹ; cực kỳ mạnh trong tái cấu trúc, đổi mới sản phẩm và khởi tạo từ con số 0. Cần người đồng hành giỏi giữ hậu phương và kiểm soát ngân sách.`,advice:`Mỗi khi muốn thay đổi lớn (đổi việc, đầu tư mới), hãy chuẩn bị sẵn phương án dự phòng tài chính để quá trình "phá cũ lập mới" diễn ra an toàn.`,citations:[{source:`Tử Vi Đẩu Số Toàn Thư`,authorOrSchool:`La Hồng Tiên`,quote:`Phá Quân chủ hao, tiên phá hậu thành.`,note:`Chữ "Hao" không chỉ là mất mát mà là tiêu hao nguồn lực cũ để mở ra chu kỳ mới.`},{source:`Tử Vi Đẩu Số Tân Biên`,authorOrSchool:`Vân Đằng Thái Thứ Lang`,note:`Phá Quân gặp Hóa Lộc hoặc Lộc Tồn sẽ giảm mạnh tính hao tán, tăng năng lực kiến tạo.`}]}},ps={"Hóa Lộc":{name:`Hóa Lộc`,category:`Tứ Hóa`,meaning:`Dòng chảy tài lộc, cơ hội thuận lợi, nhân duyên tốt và sự hanh thông tự nhiên.`,advice:`Chủ động nắm bắt cơ hội hợp tác và mở rộng nguồn thu tại cung có Hóa Lộc.`,source:`Tử Vi Đẩu Số Tân Biên & Bắc Phái Tứ Hóa`},"Hóa Quyền":{name:`Hóa Quyền`,category:`Tứ Hóa`,meaning:`Năng lực làm chủ, quyền kiểm soát, sự tự tin và sức ảnh hưởng thực tế.`,advice:`Tận dụng uy tín để dẫn dắt, nhưng tránh áp đặt quá mức gây căng thẳng.`,source:`Tử Vi Đẩu Số Tân Biên & Bắc Phái Tứ Hóa`},"Hóa Khoa":{name:`Hóa Khoa`,category:`Tứ Hóa`,meaning:`Danh tiếng tốt, học vấn, quý nhân trí thức và khả năng giải ách, hóa giải rắc rối.`,advice:`Dùng tri thức, sự minh bạch và uy tín cá nhân để mở cửa cơ hội.`,source:`Tử Vi Đẩu Số Tân Biên & Bắc Phái Tứ Hóa`},"Hóa Kỵ":{name:`Hóa Kỵ`,category:`Tứ Hóa`,meaning:`Điểm tập trung tâm sức, sự vướng mắc, thị phi hoặc bài học cần rèn luyện kỹ.`,advice:`Đừng sợ Hóa Kỵ — hãy xem đây là tín hiệu nhắc bạn kiểm tra kỹ giấy tờ, lời nói và kỳ vọng.`,source:`Tử Vi Đẩu Số Tân Biên & Trung Châu Phái`},"Lộc Tồn":{name:`Lộc Tồn`,category:`Cát tinh`,meaning:`Tài lộc bền vững, sự tích lũy chắc chắn, có quý nhân che chở; luôn bị Kình Dương và Đà La kẹp hai bên.`,advice:`Giữ nguyên tắc tích lũy đều đặn và cẩn trọng sự đố kỵ từ xung quanh.`,source:`Tử Vi Đẩu Số Toàn Thư`},"Thiên Mã":{name:`Thiên Mã`,category:`Cát tinh`,meaning:`Sự dịch chuyển, đi xa, năng động, phát triển thông qua thay đổi môi trường hoặc giao thương.`,advice:`Càng chủ động di chuyển, mở rộng thị trường hoặc học hỏi bên ngoài càng dễ gặp vận may.`,source:`Tử Vi Đẩu Số Tân Biên`},"Văn Xương":{name:`Văn Xương`,category:`Cát tinh`,meaning:`Học vấn chính quy, tư duy mạch lạc, văn chương, chứng chỉ và khả năng diễn đạt chuẩn mực.`,advice:`Phát huy lợi thế bằng cấp, viết lách, trình bày và xây dựng thương hiệu tri thức.`,source:`Tử Vi Đẩu Số Tân Biên`},"Văn Khúc":{name:`Văn Khúc`,category:`Cát tinh`,meaning:`Tài hoa, linh hoạt, nghệ thuật, hùng biện và sự nhạy bén trong giao tiếp.`,advice:`Kết hợp kiến thức chuyên môn với sự khéo léo trong giao tiếp và thẩm mỹ.`,source:`Tử Vi Đẩu Số Tân Biên`},"Tả Phù":{name:`Tả Phù`,category:`Cát tinh`,meaning:`Quý nhân trợ lực, đồng đội hỗ trợ trực tiếp, tăng độ vững chắc cho Chính tinh.`,advice:`Đề cao làm việc nhóm và duy trì mối quan hệ cộng sự lâu dài.`,source:`Tử Vi Đẩu Số Toàn Thư`},"Hữu Bật":{name:`Hữu Bật`,category:`Cát tinh`,meaning:`Sự hỗ trợ khéo léo, hậu thuẫn âm thầm, giúp xoay chuyển tình thế mềm mại.`,advice:`Biết lắng nghe góp ý từ người bên cạnh và trân trọng hậu phương.`,source:`Tử Vi Đẩu Số Toàn Thư`},"Thiên Khôi":{name:`Thiên Khôi`,category:`Cát tinh`,meaning:`Dương Quý Nhân — cơ hội rõ ràng, được cấp trên hoặc người có vị thế nâng đỡ.`,advice:`Mạnh dạn đề xuất ý tưởng với người có thẩm quyền hoặc người đi trước.`,source:`Tử Vi Đẩu Số Tân Biên`},"Thiên Việt":{name:`Thiên Việt`,category:`Cát tinh`,meaning:`Âm Quý Nhân — cơ hội bất ngờ, được giúp đỡ đúng lúc khó khăn.`,advice:`Giữ thái độ thiện chí; quý nhân thường xuất hiện qua những kết nối tình cờ.`,source:`Tử Vi Đẩu Số Tân Biên`},"Kình Dương":{name:`Kình Dương`,category:`Sát tinh`,meaning:`Sức mạnh bộc phát, quyết đoán, cạnh tranh mạnh nhưng dễ va chạm, nóng nảy hoặc chấn thương nhỏ.`,advice:`Cẩn trọng khi đi lại, thao tác vật sắc nhọn và tiết chế phản ứng bộc trực.`,source:`Tử Vi Đẩu Số Toàn Thư`},"Đà La":{name:`Đà La`,category:`Sát tinh`,meaning:`Sự bền bỉ âm thầm, kiên trì nhưng dễ dây dưa, trì hoãn hoặc vướng rắc rối ngầm.`,advice:`Giải quyết dứt điểm từng việc, tránh để tồn đọng kéo dài.`,source:`Tử Vi Đẩu Số Toàn Thư`},"Hỏa Tinh":{name:`Hỏa Tinh`,category:`Sát tinh`,meaning:`Tốc độ nhanh, bùng nổ, nhiệt huyết nhưng dễ vội vàng hoặc nóng tính.`,advice:`Làm nhanh nhưng phải kiểm tra lại lần cuối; tránh quyết định lúc đang bức xúc.`,source:`Tử Vi Đẩu Số Tân Biên`},"Linh Tinh":{name:`Linh Tinh`,category:`Sát tinh`,meaning:`Sự sắc sảo, phản ứng nhanh, âm ỉ bền bỉ nhưng dễ lo âu nội tâm.`,advice:`Giữ nhịp sinh hoạt điều độ, tránh thức khuya hoặc giữ bực bội trong lòng.`,source:`Tử Vi Đẩu Số Tân Biên`},"Địa Không":{name:`Địa Không`,category:`Sát tinh`,meaning:`Tư duy đột phá, phi truyền thống nhưng dễ gặp biến động bất ngờ về tài chính hoặc kế hoạch.`,advice:`Rất tốt cho sáng tạo ý tưởng, nhưng cần kỷ luật quản trị rủi ro và không đầu tư tất tay.`,source:`Tử Vi Đẩu Số Tân Biên`},"Địa Kiếp":{name:`Địa Kiếp`,category:`Sát tinh`,meaning:`Biến cố nhanh, bài học về sự buông bỏ và tái thiết; kích thích bản lĩnh vượt nghịch cảnh.`,advice:`Luôn có kế hoạch dự phòng (Plan B) cho tài sản và hợp đồng quan trọng.`,source:`Tử Vi Đẩu Số Tân Biên`},"Đào Hoa":{name:`Đào Hoa`,category:`Trung tinh`,meaning:`Sức hút cá nhân, duyên giao tiếp, nghệ thuật và tình cảm.`,advice:`Tận dụng thiện cảm để xây dựng thương hiệu cá nhân và giữ ranh giới rõ ràng trong tình cảm.`,source:`Tử Vi Đẩu Số Tân Biên`},"Hồng Loan":{name:`Hồng Loan`,category:`Trung tinh`,meaning:`Hỷ tín, duyên lành, thẩm mỹ tinh tế và sự duyên dáng tự nhiên.`,advice:`Thuận lợi cho các hoạt động gặp gỡ, kết nối và sự kiện vui.`,source:`Tử Vi Đẩu Số Tân Biên`},"Thiên Hình":{name:`Thiên Hình`,category:`Trung tinh`,meaning:`Kỷ luật, pháp luật, sự nghiêm minh, chuyên môn y/kỹ thuật; kỵ va chạm quy định.`,advice:`Tuân thủ đúng quy trình, luật lệ và chú ý an toàn thân thể.`,source:`Tử Vi Đẩu Số Tân Biên`},"Thiên Không":{name:`Thiên Không`,category:`Trung tinh`,meaning:`Sự sắc sảo, linh giác cao, tư duy thoát tục nhưng kỵ tham vọng quá sức.`,advice:`Biết đủ và giữ sự tỉnh táo thực tế trước những lời hứa hẹn quá tốt đẹp.`,source:`Tử Vi Hàm Số — Nguyễn Phát Lộc`},Tuần:{name:`Tuần Trung Không Vong`,category:`Không Vong`,meaning:`Giảm bớt cường độ sao trong cung (nhất là giai đoạn tiền vận): làm chậm cát tinh nhưng cũng kìm hãm mạnh sát tinh.`,advice:`Kiên nhẫn tích lũy ở giai đoạn đầu; càng về sau nền tảng càng vững.`,source:`Tử Vi Đẩu Số Tân Biên`},Triệt:{name:`Triệt Lộ Không Vong`,category:`Không Vong`,meaning:`Ngăn trở hoặc xoay chuyển mạnh ở giai đoạn dưới 30 tuổi; đặc biệt hiệu quả trong việc chặn đứng sát tinh.`,advice:`Giai đoạn đầu có thể phải đổi hướng hoặc tự lực nhiều hơn, nhưng sau tuổi 30 sẽ mở lối rõ rệt.`,source:`Tử Vi Đẩu Số Tân Biên`}},ms={Mệnh:{name:`Mệnh`,shortRole:`Bản ngã & Cốt cách`,domain:`Tính cách cốt lõi, tư duy, khí chất, điểm mạnh bẩm sinh và xu hướng lựa chọn cuộc đời.`,explainForBeginners:`Đây là cung quan trọng nhất — giống như "bộ vi xử lý" và bản chất cốt lõi của chính bạn.`,keyQuestions:[`Điểm mạnh bẩm sinh của tôi là gì?`,`Tính cách tôi cần cân bằng điều gì?`],dailyMeaning:`Hôm nay năng lượng tập trung trực tiếp vào bản thân bạn — thích hợp để tự quyết định, chăm sóc tinh thần và khởi động việc cá nhân.`},"Phụ Mẫu":{name:`Phụ Mẫu`,shortRole:`Cha mẹ & Cấp trên`,domain:`Mối quan hệ với cha mẹ, người bề trên, sếp, thầy cô và các cơ quan quản lý.`,explainForBeginners:`Không chỉ nói về cha mẹ, trong đời sống hiện đại cung này còn phản ánh duyên với cấp trên và thủ tục hành chính.`,keyQuestions:[`Quan hệ với cấp trên và gia đình lớn ra sao?`],dailyMeaning:`Hôm nay dễ có tương tác với người lớn tuổi, cấp trên hoặc giấy tờ/quy định — nên giữ thái độ tôn trọng và chuẩn bị hồ sơ kỹ.`},"Phúc Đức":{name:`Phúc Đức`,shortRole:`Nội tâm & Phúc phần`,domain:`Đời sống tinh thần, sự bình an, hưởng thụ, nền tảng dòng họ và khả năng gặp may mắn.`,explainForBeginners:`Cung Phúc Đức giống như "bình ắc quy tinh thần" — cho biết bạn có dễ cảm thấy bình an và được quý nhân nâng đỡ hay không.`,keyQuestions:[`Làm sao để tâm trí tôi bình an và gặp nhiều thuận lợi hơn?`],dailyMeaning:`Hôm nay rất hợp cho việc thư giãn, tĩnh tâm, làm việc thiện, gặp gỡ người thân hoặc nạp lại năng lượng tinh thần.`},"Điền Trạch":{name:`Điền Trạch`,shortRole:`Nhà cửa & Tài sản`,domain:`Bất động sản, không gian sống, nơi làm việc, khả năng tích lũy tài sản cố định và không khí gia đình.`,explainForBeginners:`Cho biết duyên về nhà cửa, đất đai, tích sản lâu dài và sự yên ấm trong tổ ấm.`,keyQuestions:[`Tôi có duyên với bất động sản và tích sản không?`],dailyMeaning:`Hôm nay thích hợp dọn dẹp, sắp xếp nhà cửa/bàn làm việc, bàn chuyện gia đình hoặc xem xét các tài sản cố định.`},"Quan Lộc":{name:`Quan Lộc`,shortRole:`Sự nghiệp & Công danh`,domain:`Nghề nghiệp phù hợp, phong cách làm việc, khả năng thăng tiến, học vấn và uy tín xã hội.`,explainForBeginners:`Phản ánh con đường công việc, lĩnh vực bạn dễ phát huy tài năng nhất và cách bạn xây dựng sự nghiệp.`,keyQuestions:[`Ngành nghề nào hợp với tôi?`,`Năm nay có nên chuyển việc không?`],dailyMeaning:`Hôm nay là ngày trọng tâm về công việc — rất thích hợp xử lý nhiệm vụ chính, họp hành, trình bày kế hoạch hoặc nâng cao chuyên môn.`},"Nô Bộc":{name:`Nô Bộc`,shortRole:`Bạn bè & Cộng sự`,domain:`Bạn bè, đồng nghiệp, nhân viên, khách hàng, đối tác ngang hàng và mạng lưới xã hội.`,explainForBeginners:`Ngày nay gọi là cung Giao Hữu — cho biết bạn nên chọn bạn, chọn đối tác và quản lý đội nhóm ra sao.`,keyQuestions:[`Tôi có nên hợp tác làm ăn chung với bạn bè không?`],dailyMeaning:`Hôm nay nổi bật yếu tố giao tiếp xã hội, đồng nghiệp, khách hàng — nên mở lòng hợp tác nhưng vẫn giữ ranh giới cam kết rõ ràng.`},"Thiên Di":{name:`Thiên Di`,shortRole:`Xuất hành & Xã hội`,domain:`Khả năng thích nghi khi ra ngoài xã hội, đi xa, du học/định cư, ấn tượng người ngoài nhìn về bạn.`,explainForBeginners:`Là "tấm gương bên ngoài" đối chiếu trực tiếp với cung Mệnh — cho thấy vận may của bạn khi bước ra ngoài đường.`,keyQuestions:[`Tôi có hợp đi xa lập nghiệp không?`,`Ra ngoài xã hội cần lưu ý gì?`],dailyMeaning:`Hôm nay năng lượng kích hoạt cung Thiên Di — rất hợp di chuyển, gặp đối tác bên ngoài, mở rộng quan hệ, đồng thời chú ý an toàn giao thông.`},"Tật Ách":{name:`Tật Ách`,shortRole:`Sức khỏe & Ứng phó`,domain:`Thể chất, các hệ cơ quan cần lưu ý, khả năng chịu áp lực và cách hóa giải rủi ro.`,explainForBeginners:`Giúp bạn nhận diện sớm thói quen sinh hoạt cần điều chỉnh để phòng bệnh hơn chữa bệnh.`,keyQuestions:[`Sức khỏe của tôi cần chú ý điều gì nhất?`],dailyMeaning:`Hôm nay hãy ưu tiên lắng nghe cơ thể, ăn uống điều độ, tránh làm việc quá sức hoặc thức khuya.`},"Tài Bạch":{name:`Tài Bạch`,shortRole:`Tiền bạc & Thu nhập`,domain:`Cách kiếm tiền, khả năng quản lý dòng tiền, thói quen chi tiêu và mức độ dồi dào tài chính.`,explainForBeginners:`Cho thấy bạn kiếm tiền tốt nhất bằng cách nào (chuyên môn, kinh doanh hay đầu tư) và cách giữ tiền hiệu quả.`,keyQuestions:[`Cách kiếm tiền và giữ tiền tốt nhất của tôi?`],dailyMeaning:`Hôm nay thuận lợi để rà soát tài chính, thu hồi công nợ, đàm phán giá cả hoặc lập kế hoạch chi tiêu thông minh.`},"Tử Tức":{name:`Tử Tức`,shortRole:`Con cái & Sáng tạo`,domain:`Con cái, hậu bối, học trò, các dự án sáng tạo cá nhân và đời sống tình cảm trẻ trung.`,explainForBeginners:`Ngoài con cái, cung này còn phản ánh duyên với cấp dưới nhỏ tuổi và các "đứa con tinh thần" bạn tạo ra.`,keyQuestions:[`Duyên con cái và thế hệ sau ra sao?`],dailyMeaning:`Hôm nay thích hợp dành thời gian cho con nhỏ, hướng dẫn người mới hoặc sáng tạo ý tưởng mới.`},"Phu Thê":{name:`Phu Thê`,shortRole:`Hôn nhân & Bạn đời`,domain:`Tình yêu, hôn nhân, mẫu người bạn đời tương thích và cách hai người tương tác lâu dài.`,explainForBeginners:`Cho thấy nhu cầu tình cảm của bạn, phong cách giao tiếp trong mối quan hệ và bí quyết giữ hòa khí.`,keyQuestions:[`Tình duyên và hôn nhân của tôi cần lưu ý gì?`],dailyMeaning:`Hôm nay nổi bật chuyện tình cảm và đối tác thân thiết — nên ưu tiên lắng nghe, trò chuyện nhẹ nhàng, tránh tranh luận hơn thua.`},"Huynh Đệ":{name:`Huynh Đệ`,shortRole:`Anh chị em & Tiền mặt`,domain:`Anh chị em ruột thịt, bạn thân chí cốt và dòng tiền mặt lưu động (theo Bắc Phái).`,explainForBeginners:`Phản ánh tình cảm anh em trong nhà và cũng là cung phụ trợ quan trọng cho khả năng thanh khoản tài chính.`,keyQuestions:[`Quan hệ anh em và sự hỗ trợ từ gia đình thế nào?`],dailyMeaning:`Hôm nay tốt cho việc hỏi thăm anh chị em, bạn thân hoặc rà soát các khoản chi tiêu tiền mặt ngắn hạn.`}},hs=[{name:`Trực Kiến`,rating:`Tốt`,goodFor:[`Khởi đầu kế hoạch mới`,`Xuất hành`,`Gặp gỡ đối tác`,`Học tập`],avoidFor:[`Động thổ lớn`,`Kiện tụng`],summary:`Khí vượng khởi sinh — rất hợp bắt đầu việc mới, ra ngoài giao dịch.`},{name:`Trực Trừ`,rating:`Tốt`,goodFor:[`Giải quyết việc tồn đọng`,`Khám chữa bệnh`,`Dọn dẹp`,`Cắt bỏ thói quen xấu`],avoidFor:[`Khai trương lớn`,`Cho vay nợ`],summary:`Tống cựu nghinh tân — tốt để tháo gỡ vướng mắc, thanh lọc không gian.`},{name:`Trực Mãn`,rating:`Tốt`,goodFor:[`Ký kết hợp đồng`,`Thu nợ`,`Mua sắm`,`Tiệc mừng & giao lưu`],avoidFor:[`Tranh chấp pháp lý`,`Chuyển việc vội vàng`],summary:`Tròn đầy sung túc — thuận lợi cho tài chính, giao tế và hoàn thiện việc.`},{name:`Trực Bình`,rating:`Trung bình`,goodFor:[`Công việc thường nhật`,`Hòa giải`,`Sửa chữa nhỏ`,`Đi lại bình thường`],avoidFor:[`Đầu tư mạo hiểm`,`Tranh cãi gay gắt`],summary:`Bình hòa ổn định — thích hợp duy trì nhịp độ đều đặn, không nên vội vàng.`},{name:`Trực Định`,rating:`Tốt`,goodFor:[`Chốt thỏa thuận`,`Họp chiến lược`,`Cầu hôn / gặp gia đình`,`Ký hợp đồng dài hạn`],avoidFor:[`Kiện tụng`,`Đi xa bất ngờ không chuẩn bị`],summary:`Vững chãi an định — rất tốt để chốt kế hoạch và cam kết bền vững.`},{name:`Trực Chấp`,rating:`Trung bình`,goodFor:[`Thực thi quy trình có sẵn`,`Kiểm kê`,`Hoàn thành deadline`],avoidFor:[`Dọn nhà`,`Chi tiêu khoản lớn không dự tính`],summary:`Nắm giữ bền bỉ — nên bám sát kế hoạch đã định, tránh thay đổi đột ngột.`},{name:`Trực Phá`,rating:`Cẩn trọng`,goodFor:[`Tháo dỡ cái cũ`,`Rà soát lỗi sai`,`Khám sức khỏe`],avoidFor:[`Ký hợp đồng lớn`,`Khai trương`,`Tranh luận cảm tính`],summary:`Ngày Nhật Phá (xung tháng) — nên giữ tâm bình tĩnh, tránh việc trọng đại và cẩn trọng khi đi lại.`},{name:`Trực Nguy`,rating:`Cẩn trọng`,goodFor:[`Cầu an`,`Nghỉ ngơi`,`Làm việc văn phòng an toàn`],avoidFor:[`Leo cao / đi đường nguy hiểm`,`Đầu tư rủi ro cao`],summary:`Khí dễ biến động — ưu tiên an toàn, đi chậm chắc và kiểm tra kỹ trước khi hành động.`},{name:`Trực Thành`,rating:`Tốt`,goodFor:[`Khai trương`,`Xuất hành`,`Ký kết`,`Gặp quý nhân`,`Nhập học`],avoidFor:[`Kiện tụng tranh chấp`],summary:`Thành tựu hanh thông — một trong những trực đẹp nhất để làm việc quan trọng.`},{name:`Trực Thu`,rating:`Trung bình`,goodFor:[`Thu hoạch kết quả`,`Thu hồi công nợ`,`Học tập tích lũy`],avoidFor:[`Chi tiêu hoang phí`,`Khởi công mới quy mô lớn`],summary:` uật và tổ chức — cần người cầm trịch vững vàng và kế hoạch bài bản.`,classical:`Sư trinh trượng nhân cát, vô cữu.`,modern:`Việc lớn cần quy trình, phân công rõ ràng và sự dẫn dắt quyết đoán.`},"5-7":{number:8,name:`Thủy Địa Tỷ`,han:`水地比`,rating:`Đại Cát`,core:`Gắn kết thân hòa — hợp tác chân thành mang lại lợi ích chung bền vững.`,classical:`Tỷ cát. Nguyên phệ nguyên vĩnh trinh, vô cữu.`,modern:`Rất thuận để kết nối đối tác, xây dựng đội nhóm và mở lòng tin cậy đúng người.`},"4-0":{number:9,name:`Phong Thiên Tiểu Súc`,han:`風天小畜`,rating:`Bình Hòa`,core:`Tích tiểu thành đại — chưa bùng nổ ngay nhưng từng bước nhỏ đều có giá trị.`,classical:`Tiểu súc hanh. Mật vân bất vũ, tự ngã tây giao.`,modern:`Hãy kiên trì hoàn thiện chi tiết nhỏ và tích lũy nguồn lực trước khi tung đòn lớn.`},"0-1":{number:10,name:`Thiên Trạch Lý`,han:`天澤履`,rating:`Cát`,core:`Đi trên đường chuẩn mực — thận trọng, lễ độ thì dù việc khó vẫn bình an.`,classical:`Lý hổ vĩ, bất điệt nhân, hanh.`,modern:`Tình huống đòi hỏi sự khéo léo và tuân thủ nguyên tắc; cư xử đúng mực sẽ hóa giải áp lực.`},"7-0":{number:11,name:`Địa Thiên Thái`,han:`地天泰`,rating:`Đại Cát`,core:`Âm dương giao hòa — hanh thông, thuận lợi, trên dưới đồng lòng.`,classical:`Thái: tiểu vãng đại lai, cát hanh.`,modern:`Quẻ rất đẹp cho hợp tác, ký kết, tình cảm và triển khai kế hoạch — hãy tận dụng đà thuận này.`},"0-7":{number:12,name:`Thiên Địa Bĩ`,han:`天地否`,rating:`Cẩn Trọng`,core:`Tạm thời bế tắc — nên thu mình củng cố nội lực, chờ lúc vận xoay chiều.`,classical:`Bĩ chi phỉ nhân, bất lợi quân tử trinh.`,modern:`Giao tiếp hai bên đang lệch pha; không nên ép tiến độ lúc này, hãy lùi một bước để rà soát lại.`},"0-2":{number:13,name:`Thiên Hỏa Đồng Nhân`,han:`天火同人`,rating:`Đại Cát`,core:`Đồng tâm hiệp lực — cùng chí hướng sẽ vượt qua thử thách dễ dàng.`,classical:`Đồng nhân vu dã, hanh, lợi thiệp đại xuyên.`,modern:`Rất hợp làm việc nhóm, gặp gỡ cộng đồng và chia sẻ mục tiêu minh bạch.`},"2-0":{number:14,name:`Hỏa Thiên Đại Hữu`,han:`火天大有`,rating:`Đại Cát`,core:`Dồi dào sáng tỏ — tài lộc và uy tín cùng tăng trưởng mạnh.`,classical:`Đại hữu: nguyên hanh.`,modern:`Giai đoạn thu hoạch rõ rệt; giữ sự khiêm tốn và hào phóng sẽ nhân đôi thành quả.`},"7-6":{number:15,name:`Địa Sơn Khiêm`,han:`地山謙`,rating:`Đại Cát`,core:`Khiêm nhường đắc lợi — càng biết lắng nghe và hạ cái tôi càng bền vững.`,classical:`Khiêm hanh, quân tử hữu chung.`,modern:`Quẻ duy nhất 6 hào đều cát: thái độ cầu thị và điềm đạm chính là chìa khóa thắng lợi.`},"3-7":{number:16,name:`Lôi Địa Dự`,han:`雷地豫`,rating:`Cát`,core:`Hưng phấn và dự phòng — thuận lợi khởi động nhưng không được chủ quan.`,classical:`Dự lợi kiến hầu hành sư.`,modern:`Tinh thần đang lên cao; hãy biến sự hào hứng thành kế hoạch hành động cụ thể kèm phương án dự phòng.`},"1-3":{number:17,name:`Trạch Lôi Tùy`,han:`澤雷隨`,rating:`Cát`,core:`Tùy thời linh hoạt — thuận theo dòng chảy thực tế thay vì cố chấp.`,classical:`Tùy nguyên hanh lợi trinh, vô cữu.`,modern:`Thích nghi nhanh với hoàn cảnh mới và lắng nghe tín hiệu thị trường sẽ giúp bạn nhẹ nhàng đạt mục tiêu.`},"6-4":{number:18,name:`Sơn Phong Cổ`,han:`山風蠱`,rating:`Cẩn Trọng`,core:`Chỉnh đốn cái cũ — sửa chữa sai sót tồn đọng để mở ra trang mới.`,classical:`Cổ nguyên hanh, lợi thiệp đại xuyên.`,modern:`Đừng né tránh vấn đề cũ nữa; dứt khoát rà soát và tái cấu trúc ngay hôm nay sẽ hóa hung thành cát.`},"7-1":{number:19,name:`Địa Trạch Lâm`,han:`地澤臨`,rating:`Đại Cát`,core:`Tiến bước vững vàng — cơ hội đang đến gần, cần giữ đạo lý và tầm nhìn dài.`,classical:`Lâm nguyên hanh lợi trinh.`,modern:`Đà phát triển rất sáng; chủ động tiến tới nhưng vẫn nhớ chuẩn bị cho giai đoạn sau.`},"4-7":{number:20,name:`Phong Địa Quán`,han:`風地觀`,rating:`Bình Hòa`,core:`Quan sát thấu đáo — đứng lùi lại nhìn toàn cảnh trước khi ra quyết định.`,classical:`Quán quán nhi bất tiến, hữu phu ngung nhược.`,modern:`Lúc này nên thu thập thông tin, quan sát hành động thực tế của đối phương thay vì hành động vội.`},"2-3":{number:21,name:`Hỏa Lôi Phệ Hạp`,han:`火雷噬嗑`,rating:`Bình Hòa`,core:`Tháo gỡ nút thắt — cần dứt khoát xử lý rào cản bằng sự công minh.`,classical:`Phệ hạp hanh, lợi dụng ngục.`,modern:`Có một điểm nghẽn cần nói thẳng và giải quyết rõ ràng theo đúng nguyên tắc.`},"6-2":{number:22,name:`Sơn Hỏa Bí`,han:`山火賁`,rating:`Cát`,core:`Trau chuốt hình thức — trình bày đẹp mắt nhưng phải đi kèm thực chất.`,classical:`Bí hanh, tiểu lợi hữu du vãng.`,modern:`Tốt cho việc nhỏ, truyền thông, thẩm mỹ và gặp gỡ; với việc lớn cần xem kỹ nội dung cốt lõi.`},"6-7":{number:23,name:`Sơn Địa Bác`,han:`山地剝`,rating:`Cẩn Trọng`,core:`Bào mòn dần — nên giữ thế thủ, bảo toàn tài sản và tránh mạo hiểm.`,classical:`Bác bất lợi hữu du vãng.`,modern:`Không nên mở rộng hay đầu tư lớn lúc này; hãy cắt giảm thứ không cần thiết để giữ an toàn.`},"7-3":{number:24,name:`Địa Lôi Phục`,han:`地雷復`,rating:`Cát`,core:`Nhất dương lai phục — ánh sáng quay trở lại, chu kỳ mới đầy hy vọng.`,classical:`Phục hanh, xuất nhập vô tật, bằng lai vô cữu.`,modern:`Khó khăn đang đi qua; hãy bắt đầu lại từng bước nhỏ với tâm thế lạc quan.`},"0-3":{number:25,name:`Thiên Lôi Vô Vọng`,han:`天雷無妄`,rating:`Cát`,core:`Chân thành vô tư — làm đúng lương tâm và thực tế thì tự nhiên hanh thông.`,classical:`Vô vọng nguyên hanh lợi trinh.`,modern:`Tránh tính toán đường tắt hay kỳ vọng phi thực tế; cứ làm thẳng thắn, minh bạch là tốt nhất.`},"6-0":{number:26,name:`Sơn Thiên Đại Súc`,han:`山天大畜`,rating:`Đại Cát`,core:`Tích lũy lớn lao — nội lực dồi dào, đủ sức gánh vác việc trọng đại.`,classical:`Đại súc lợi trinh, bất gia thực cát, lợi thiệp đại xuyên.`,modern:`Nền tảng kiến thức và tài lực đang rất tốt — có thể tự tin bước ra sân chơi lớn hơn.`},"6-3":{number:27,name:`Sơn Lôi Di`,han:`山雷頤`,rating:`Bình Hòa`,core:`Nuôi dưỡng thân tâm — cẩn trọng lời ăn tiếng nói và nguồn dinh dưỡng.`,classical:`Di trinh cát, quán di tự cầu khẩu thực.`,modern:`Chú ý sức khỏe, cách tiêu thụ thông tin và lời nói hằng ngày để giữ năng lượng sạch.`},"1-4":{number:28,name:`Trạch Phong Đại Quá`,han:`澤風大過`,rating:`Cẩn Trọng`,core:`Áp lực vượt ngưỡng — cần giải pháp táo bạo hoặc san sẻ gánh nặng kịp thời.`,classical:`Đại quá đống nạo, lợi hữu du vãng, hanh.`,modern:`Bạn đang gồng quá sức ở một khâu nào đó; hãy giảm tải hoặc đổi phương án linh hoạt hơn.`},"5-5":{number:29,name:`Thuần Khảm`,han:`坎為水`,rating:`Cẩn Trọng`,core:`Vượt qua thử thách — giữ lòng thành tín và bền bỉ như dòng nước chảy.`,classical:`Tập khảm hữu phu, duy tâm hanh, hành hữu thượng.`,modern:`Có chướng ngại trước mắt nhưng không đáng sợ nếu bạn bình tĩnh xử lý từng lớp một.`},"2-2":{number:30,name:`Thuần Ly`,han:`離為火`,rating:`Cát`,core:`Sáng rõ minh bạch — dựa vào đúng giá trị và cộng sự tin cậy sẽ tỏa sáng.`,classical:`Ly lợi trinh, hanh. Súc tẫn ngưu, cát.`,modern:`Mọi việc cần rõ ràng, có văn bản và chọn đúng người đồng hành để bền lửa.`},"1-6":{number:31,name:`Trạch Sơn Hàm`,han:`澤山咸`,rating:`Đại Cát`,core:`Cảm ứng chân thành — rất đẹp cho tình cảm, kết nối và sự thấu hiểu.`,classical:`Hàm hanh lợi trinh, thủ nữ cát.`,modern:`Sự đồng cảm tự nhiên đang rất mạnh; hãy bày tỏ chân thành để gắn kết sâu sắc hơn.`},"3-4":{number:32,name:`Lôi Phong Hằng`,han:`雷風恆`,rating:`Cát`,core:`Bền bỉ dài lâu — giữ nhịp ổn định sẽ tạo nên thành tựu chắc chắn.`,classical:`Hằng hanh vô cữu, lợi trinh, lợi hữu du vãng.`,modern:`Không cần thay đổi vội; cứ duy trì kỷ luật và cam kết hiện tại sẽ sinh quả ngọt.`},"0-6":{number:33,name:`Thiên Sơn Độn`,han:`天山遯`,rating:`Cẩn Trọng`,core:`Lùi bước chiến lược — rút lui đúng lúc để bảo toàn thế mạnh.`,classical:`Độn hanh, tiểu lợi trinh.`,modern:`Nếu thấy môi trường hoặc kèo này không ổn, chủ động rút sớm là quyết định thông minh.`},"3-0":{number:34,name:`Lôi Thiên Đại Tráng`,han:`雷天大壯`,rating:`Cát`,core:`Khí thế mạnh mẽ — năng lượng dồi dào nhưng phải giữ đúng chừng mực.`,classical:`Đại tráng lợi trinh.`,modern:`Bạn đang có lợi thế rõ ràng; dùng sức mạnh một cách điềm tĩnh sẽ tránh va chạm không đáng.`},"2-7":{number:35,name:`Hỏa Địa Tấn`,han:`火地晉`,rating:`Đại Cát`,core:`Thăng tiến rực rỡ — như mặt trời mọc, dễ được ghi nhận và trọng dụng.`,classical:`Tấn khang hầu dụng tích mã phồn thứ.`,modern:`Cơ hội tiến bước rõ rệt trong công việc và uy tín; hãy tự tin thể hiện năng lực.`},"7-2":{number:36,name:`Địa Hỏa Minh Di`,han:`地火明夷`,rating:`Cẩn Trọng`,core:`Giấu ánh sáng — giữ kín kế hoạch, nhẫn nại qua giai đoạn nhạy cảm.`,classical:`Minh di lợi gian trinh.`,modern:`Đừng phô trương hay đối đầu trực diện lúc này; giữ thái độ khiêm tốn và bảo vệ năng lượng bản thân.`},"4-2":{number:37,name:`Phong Hỏa Gia Nhân`,han:`風火家人`,rating:`Cát`,core:`Gia đạo hòa thuận — trong ấm ngoài êm, mỗi người tròn vai của mình.`,classical:`Gia nhân lợi nữ trinh.`,modern:`Tập trung vun vén người thân, đội ngũ nội bộ và những cam kết rõ ràng trong nhà.`},"2-1":{number:38,name:`Hỏa Trạch Khuê`,han:`火澤睽`,rating:`Bình Hòa`,core:`Khác biệt góc nhìn — tôn trọng sự khác nhau để tìm điểm chung ở việc nhỏ.`,classical:`Khuê tiểu sự cát.`,modern:`Hai bên đang nhìn khác hướng; chưa nên chốt việc đại sự ngay, hãy thống nhất từ việc nhỏ trước.`},"5-6":{number:39,name:`Thủy Sơn Kiển`,han:`水山蹇`,rating:`Cẩn Trọng`,core:`Đường trước có dốc — tạm dừng điều chỉnh hướng đi và tìm quý nhân hỗ trợ.`,classical:`Kiển lợi tây nam, bất lợi đông bắc, lợi kiến đại nhân.`,modern:`Gặp lực cản thì không nên cố đâm đầu vào tường; hãy đổi chiến thuật và hỏi ý kiến chuyên gia.`},"3-5":{number:40,name:`Lôi Thủy Giải`,han:`雷水解`,rating:`Đại Cát`,core:`Tháo gỡ bế tắc — mây mù tan biến, vướng mắc sắp được giải quyết êm đẹp.`,classical:`Giải lợi tây nam, vô sở vãng kỳ lai phục cát.`,modern:`Tin vui giải tỏa áp lực; nếu cần hành động để chốt hạ, hãy làm sớm dứt điểm.`},"6-1":{number:41,name:`Sơn Trạch Tổn`,han:`山澤損`,rating:`Bình Hòa`,core:`Bớt ngắn để được dài — biết cắt giảm cái thừa thì tương lai sẽ tăng trưởng.`,classical:`Tổn hữu phu, nguyên cát vô cữu.`,modern:`Chấp nhận nhượng bộ nhỏ hoặc tiết chế chi tiêu hôm nay sẽ đổi lại lợi ích bền vững.`},"4-3":{number:42,name:`Phong Lôi Ích`,han:`風雷益`,rating:`Đại Cát`,core:`Gia tăng lợi ích — đôi bên cùng có lợi, rất tốt để đầu tư phát triển.`,classical:`Ích lợi hữu du vãng, lợi thiệp đại xuyên.`,modern:`Thời cơ thuận lợi để mở rộng, học kỹ năng mới hoặc bắt tay hợp tác win-win.`},"1-0":{number:43,name:`Trạch Thiên Quải`,han:`澤天夬`,rating:`Bình Hòa`,core:`Quyết đoán minh bạch — cần dứt khoát loại bỏ điều mập mờ một cách khéo léo.`,classical:`Quải dương vu vương đình, phu hiệu hữu lệ.`,modern:`Đã đến lúc ra quyết định rõ ràng, công khai nhưng dùng lý lẽ ôn hòa thay vì gay gắt.`},"0-4":{number:44,name:`Thiên Phong Cấu`,han:`天風姤`,rating:`Bình Hòa`,core:`Cuộc gặp bất ngờ — cơ hội hoặc nhân duyên đến nhanh, cần tỉnh táo kiểm chứng.`,classical:`Cấu nữ tráng, vật dụng thủ nữ.`,modern:`Có tín hiệu/lời mời mới bất ngờ; hãy đón nhận cởi mở nhưng chưa vội cam kết sâu ngay.`},"1-7":{number:45,name:`Trạch Địa Tụy`,han:`澤地萃`,rating:`Đại Cát`,core:`Tụ hội nguồn lực — tập hợp nhân tài, tài lộc và cộng đồng cùng hướng.`,classical:`Tụy hanh, vương cách hữu miếu, lợi kiến đại nhân.`,modern:`Rất tốt cho họp mặt, kêu gọi hợp tác, sự kiện đông người và xây dựng mạng lưới.`},"7-4":{number:46,name:`Địa Phong Thăng`,han:`地風升`,rating:`Đại Cát`,core:`Từng bước đi lên — tăng trưởng đều đặn, chắc chắn như cây vươn cao.`,classical:`Thăng nguyên hanh, dụng kiến đại nhân, vật tuất.`,modern:`Tiến độ rất tích cực; cứ kiên trì từng nấc thang, đừng sốt ruột nhảy cóc.`},"1-5":{number:47,name:`Trạch Thủy Khốn`,han:`澤水困`,rating:`Cẩn Trọng`,core:`Tạm thời cạn lực — giữ vững tinh thần, nói ít làm chắc rồi sẽ thoát khó.`,classical:`Khốn hanh trinh, đại nhân cát vô cữu, hữu ngôn bất tín.`,modern:`Lúc này lời giải thích ít tác dụng; hãy chứng minh bằng hành động bền bỉ và chăm sóc sức khỏe.`},"5-4":{number:48,name:`Thủy Phong Tỉnh`,han:`水風井`,rating:`Cát`,core:`Giếng nước nuôi người — giá trị cốt lõi bền vững, càng chia sẻ càng sâu.`,classical:`Tỉnh cải ấp bất cải tỉnh, vô táng vô đắc.`,modern:`Hãy quay về trau dồi chuyên môn cốt lõi và quy trình phục vụ thật tốt — lộc sẽ tự tìm đến.`},"1-2":{number:49,name:`Trạch Hỏa Cách`,han:`澤火革`,rating:`Cát`,core:`Cải cách đổi mới — thay đổi đúng thời điểm để bước sang giai đoạn tốt hơn.`,classical:`Cách tị nhật nãi phu, nguyên hanh lợi trinh, hối vong.`,modern:`Cái cũ đã hết vai trò; hãy chuẩn bị kỹ và mạnh dạn làm mới phương pháp hoặc môi trường.`},"2-4":{number:50,name:`Hỏa Phong Đỉnh`,han:`火風鼎`,rating:`Đại Cát`,core:`Vững như kiềng ba chân — thành tựu mới hình thành, uy tín và tài lộc bền.`,classical:`Đỉnh nguyên cát hanh.`,modern:`Quẻ rất đẹp cho khởi tạo dự án, thăng chức và hợp tác 3 bên vững chắc.`},"3-3":{number:51,name:`Thuần Chấn`,han:`震為雷`,rating:`Bình Hòa`,core:`Biến động bất ngờ — giữ tâm điềm tĩnh trước tin đột ngột sẽ biến nguy thành an.`,classical:`Chấn hanh, chấn lai khích khích, tiếu ngôn ách ách.`,modern:`Có thể có thay đổi nhanh ngoài dự kiến; hít thở sâu, bình tĩnh xử lý thì mọi chuyện lại ổn.`},"6-6":{number:52,name:`Thuần Cấn`,han:`艮為山`,rating:`Bình Hòa`,core:`Dừng lại đúng lúc — tĩnh tâm quan sát, không vội chạy theo ồn ào.`,classical:`Cấn kỳ bối, bất hoạch kỳ thân.`,modern:`Nghỉ ngơi, chốt ranh giới rõ ràng và tập trung hoàn tất việc hiện tại thay vì mở thêm việc mới.`},"4-6":{number:53,name:`Phong Sơn Tiệm`,han:`風山漸`,rating:`Đại Cát`,core:`Tiến triển tuần tự — chậm mà chắc, kết quả bền vững theo năm tháng.`,classical:`Tiệm nữ quy cát, lợi trinh.`,modern:`Rất tốt cho tình cảm nghiêm túc, sự nghiệp dài hạn và tích sản đều đặn.`},"3-1":{number:54,name:`Lôi Trạch Quy Muội`,han:`雷澤歸妹`,rating:`Cẩn Trọng`,core:`Tránh hấp tấp cảm tính — xét rõ vị trí và điều khoản trước khi nhận lời.`,classical:`Quy muội chinh hung, vô du lợi.`,modern:`Đừng quyết định chỉ vì cảm xúc nhất thời; cần làm rõ quyền lợi, trách nhiệm của đôi bên.`},"3-2":{number:55,name:`Lôi Hỏa Phong`,han:`雷火豐`,rating:`Đại Cát`,core:`Thịnh vượng rực rỡ — thời điểm đỉnh cao để quyết đoán và gặt hái.`,classical:`Phong hanh, vương cách chi, vật ưu nghi nhật trung.`,modern:`Năng lượng và cơ hội đang ở độ chí
